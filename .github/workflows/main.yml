name: Ejecutar proyecto

on:
  workflow_dispatch:

jobs:
  ejecutar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Obtener datos IDENA
        run: |
          curl -L "https://idena.navarra.es/ogc/wfs" \
            --data-urlencode "service=WFS" \
            --data-urlencode "request=GetCapabilities" \
            -o idena-capabilities.xml

      - name: Obtener datos de Bera
        run: |
          curl -L --get "https://idena.navarra.es/ogc/wfs" \
            --data-urlencode "service=WFS" \
            --data-urlencode "version=2.0.0" \
            --data-urlencode "request=GetFeature" \
            --data-urlencode "typeNames=IDENA:OCUPAC_Pol_MCA_VE2000" \
            --data-urlencode "outputFormat=application/json" \
            --data-urlencode "count=1000" \
            --data-urlencode "CQL_FILTER=MUNICIPIO='Bera' AND GRUPO='Frondosas'" \
            -o bera-frondosas.json

      - name: Calcular hectáreas
        run: |
          python - <<'PY'
          import json

          with open("bera-frondosas.json", encoding="utf-8") as f:
              datos = json.load(f)

          total = sum(
              feature["properties"].get("HECTAREAS", 0) or 0
              for feature in datos["features"]
          )

          print(f"Superficie total: {total:.2f} hectáreas")
          print(f"Número de parcelas: {len(datos['features'])}")
          PY
      - name: Crear tabla de parcelas
        run: |
          python - <<'PY'
          import json
          import csv

          with open("bera-frondosas.json", encoding="utf-8") as f:
              datos = json.load(f)

          with open("parcelas-bera.csv", "w", newline="", encoding="utf-8") as f:
              escritor = csv.writer(f)
              escritor.writerow(["Recinto", "Municipio", "Grupo", "Tipo", "Etiqueta", "Hectáreas"])

              for feature in datos["features"]:
                  p = feature["properties"]
                  escritor.writerow([
                      p.get("CRECINTO"),
                      p.get("MUNICIPIO"),
                      p.get("GRUPO"),
                      p.get("TIPO"),
                      p.get("ETIQUETA"),
                      p.get("HECTAREAS")
                  ])

          print("Tabla creada: parcelas-bera.csv")
          PY
      - name: Crear mapa de Bera
        run: |
          python - <<'PY'
          import json
          import html

          with open("bera-frondosas.json", encoding="utf-8") as f:
              datos = json.load(f)

          geojson = json.dumps(datos, ensure_ascii=False)

          mapa = f"""<!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="utf-8">
            <title>Frondosas de Bera</title>
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <link rel="stylesheet"
              href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
            <style>
              html, body, #map {{
                height: 100%;
                margin: 0;
              }}
            </style>
          </head>
          <body>
            <div id="map"></div>

            <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
            <script>
              const datos = {geojson};

              const map = L.map('map');

              L.tileLayer(
                'https://{{s}}.tile.openstreetmap.org/{{z}}/{{x}}/{{y}}.png',
                {{
                  attribution: '&copy; OpenStreetMap contributors'
                }}
              ).addTo(map);

              const capa = L.geoJSON(datos, {{
                onEachFeature: function(feature, layer) {{
                  const p = feature.properties || {{}};

                  layer.bindPopup(
                    '<b>Recinto:</b> ' + (p.CRECINTO ?? '') +
                    '<br><b>Tipo:</b> ' + (p.TIPO ?? '') +
                    '<br><b>Etiqueta:</b> ' + (p.ETIQUETA ?? '') +
                    '<br><b>Hectáreas:</b> ' + (p.HECTAREAS ?? '')
                  );
                }}
              }}).addTo(map);

              map.fitBounds(capa.getBounds());
            </script>
          </body>
          </html>
          """

          with open("mapa-bera.html", "w", encoding="utf-8") as f:
              f.write(mapa)

          print("Mapa creado: mapa-bera.html")
          PY

      - name: Guardar mapa
        uses: actions/upload-artifact@v4
        with:
          name: mapa-bera
          path: mapa-bera.html
      - name: Guardar tabla de parcelas
        uses: actions/upload-artifact@v4
        with:
          name: tabla-parcelas-bera
          path: parcelas-bera.csv
      - name: Guardar datos de Bera
        uses: actions/upload-artifact@v4
        with:
          name: bera-frondosas
          path: bera-frondosas.json

      - name: Guardar datos IDENA
        uses: actions/upload-artifact@v4
        with:
          name: idena-capabilities
          path: idena-capabilities.xml

      - name: Mostrar estructura
        run: |
          echo "Proyecto lurrak-lurrak-permacultura"
          echo "Flujo ejecutado correctamente"
          find . -maxdepth 2 -type f | sort
