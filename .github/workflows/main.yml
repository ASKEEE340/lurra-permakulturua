name: Sistema Maestro de la Finca

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  sistema-maestro:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. PREPARACIÓN
      # ============================================================

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar expediente
        run: |
          rm -rf expediente public
          mkdir -p expediente/{terreno,agua,clima,suelo,vegetacion,satelite,parcelas,normativa,analisis,informes}
          mkdir -p agentes
          mkdir -p public

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests pyproj

      # ============================================================
      # 2. CONFIGURACIÓN CENTRAL
      # ============================================================

      - name: Crear configuración de la finca
        run: |
          cat > expediente/finca.json <<'EOF'
          {
            "nombre": "Lurra - Finca de permacultura",
            "coordenadas": {
              "latitud": 42.8962739,
              "longitud": -1.5961049
            },
            "altitud_referencia_m": 590.1082552,
            "sistema_coordenadas": "EPSG:4326",
            "utm": "EPSG:25830",
            "radio_busqueda_m": 1000,
            "objetivo": "Regeneración del terreno, vida en la finca y diseño de permacultura"
          }
          EOF

      # ============================================================
      # 3. AGENTE TERRENO
      # ============================================================

      - name: Crear agente terreno
        run: |
          cat > agentes/terreno.py <<'PY'
          import json
          import requests
          from pathlib import Path

          OUT = Path("expediente/terreno")
          OUT.mkdir(parents=True, exist_ok=True)

          with open("expediente/finca.json", encoding="utf-8") as f:
              finca = json.load(f)

          lat = finca["coordenadas"]["latitud"]
          lon = finca["coordenadas"]["longitud"]

          resultado = {
              "agente": "terreno",
              "estado": "OK",
              "punto": {
                  "latitud": lat,
                  "longitud": lon
              },
              "altitud_referencia_usuario_m": finca["altitud_referencia_m"],
              "fuentes": {},
              "observaciones": []
          }

          # OGC API Coverages del IGN.
          # Se solicita únicamente una pequeña ventana alrededor del punto.
          fuentes = {
              "mdt_5m": "https://api-coverages.idee.es/collections/EL.ElevationGridCoverage_4258_5_PB",
              "mdt_25m": "https://api-coverages.idee.es/collections/EL.ElevationGridCoverage_4258_25_PB"
          }

          delta = 0.0005

          bbox = f"{lon-delta},{lat-delta},{lon+delta},{lat+delta}"

          for nombre, url in fuentes.items():

              try:
                  r = requests.get(
                      url,
                      params={
                          "f": "json"
                      },
                      timeout=60
                  )

                  r.raise_for_status()

                  metadata = r.json()

                  resultado["fuentes"][nombre] = {
                      "accesible": True,
                      "titulo": metadata.get("title"),
                      "id": metadata.get("id"),
                      "bbox_consultado": bbox
                  }

              except Exception as e:

                  resultado["fuentes"][nombre] = {
                      "accesible": False,
                      "error": str(e)
                  }

          # Intento de consulta puntual de cobertura.
          # El servidor puede limitar la resolución o parámetros.
          for nombre, url in fuentes.items():

              try:

                  r = requests.get(
                      url + "/coverage",
                      params={
                          "f": "json",
                          "bbox": bbox,
                          "subset": [
                              f"Lat({lat-0.0001},{lat+0.0001})",
                              f"Long({lon-0.0001},{lon+0.0001})"
                          ]
                      },
                      timeout=60
                  )

                  if r.ok:

                      try:
                          datos = r.json()

                          with open(
                              OUT / f"{nombre}_punto.json",
                              "w",
                              encoding="utf-8"
                          ) as f:
                              json.dump(
                                  datos,
                                  f,
                                  ensure_ascii=False,
                                  indent=2
                              )

                          resultado["observaciones"].append(
                              f"Se obtuvo respuesta de cobertura para {nombre}"
                          )

                      except Exception:
                          resultado["observaciones"].append(
                              f"{nombre}: respuesta no JSON"
                          )

                  else:
                      resultado["observaciones"].append(
                          f"{nombre}: cobertura no disponible mediante esta consulta"
                      )

              except Exception as e:

                  resultado["observaciones"].append(
                      f"{nombre}: {str(e)}"
                  )

          with open(
              OUT / "terreno.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  resultado,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(json.dumps(resultado, ensure_ascii=False, indent=2))
          PY

      # ============================================================
      # 4. AGENTE PARCELAS
      # ============================================================

      - name: Crear agente parcelas
        run: |
          cat > agentes/parcelas.py <<'PY'
          import json
          import requests
          from pathlib import Path

          OUT = Path("expediente/parcelas")
          OUT.mkdir(parents=True, exist_ok=True)

          with open("expediente/finca.json", encoding="utf-8") as f:
              finca = json.load(f)

          lat = finca["coordenadas"]["latitud"]
          lon = finca["coordenadas"]["longitud"]

          # Conversión aproximada a UTM 30N.
          from pyproj import Transformer

          transformer = Transformer.from_crs(
              "EPSG:4326",
              "EPSG:25830",
              always_xy=True
          )

          x, y = transformer.transform(lon, lat)

          radio = finca["radio_busqueda_m"]

          bbox = f"{x-radio},{y-radio},{x+radio},{y+radio}"

          url = "https://inspire.navarra.es/services/CP/wfs"

          params = {
              "service": "WFS",
              "version": "2.0.0",
              "request": "GetFeature",
              "typenames": "CP:CadastralParcel",
              "outputFormat": "application/json",
              "srsName": "EPSG:25830",
              "bbox": bbox,
              "count": 500
          }

          resultado = {
              "agente": "parcelas",
              "estado": "PENDIENTE",
              "punto_wgs84": {
                  "latitud": lat,
                  "longitud": lon
              },
              "punto_utm": {
                  "x": x,
                  "y": y
              },
              "bbox_utm": bbox,
              "numero_elementos": 0
          }

          try:

              r = requests.get(
                  url,
                  params=params,
                  timeout=120
              )

              r.raise_for_status()

              data = r.json()

              features = data.get("features", [])

              resultado["numero_elementos"] = len(features)

              if features:
                  resultado["estado"] = "OK"

              with open(
                  OUT / "parcelas.geojson",
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      data,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

              # Buscar la parcela que contiene el punto
              # mediante consulta espacial posterior si es posible.
              resultado["datos"] = features

          except Exception as e:

              resultado["estado"] = "ERROR"
              resultado["error"] = str(e)

          with open(
              OUT / "parcelas.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  resultado,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "Parcelas encontradas:",
              resultado["numero_elementos"]
          )
          PY

      # ============================================================
      # 5. AGENTE AGUA
      # ============================================================

      - name: Crear agente agua
        run: |
          cat > agentes/agua.py <<'PY'
          import json
          import requests
          from pathlib import Path
          from pyproj import Transformer

          OUT = Path("expediente/agua")
          OUT.mkdir(parents=True, exist_ok=True)

          with open("expediente/finca.json", encoding="utf-8") as f:
              finca = json.load(f)

          lat = finca["coordenadas"]["latitud"]
          lon = finca["coordenadas"]["longitud"]

          transformer = Transformer.from_crs(
              "EPSG:4326",
              "EPSG:25830",
              always_xy=True
          )

          x, y = transformer.transform(lon, lat)

          radio = finca["radio_busqueda_m"]

          bbox = f"{x-radio},{y-radio},{x+radio},{y+radio}"

          url = "https://idena.navarra.es/ogc/wfs"

          capas = {
              "hidrografia_lineal": "CARBTU_Lin_Hidrografia_201",
              "hidrografia_poligonal": "CARBTU_Pol_Hidrografia_201"
          }

          resultado = {
              "agente": "agua",
              "estado": "OK",
              "bbox_utm": bbox,
              "capas": {}
          }

          for nombre, capa in capas.items():

              params = {
                  "service": "WFS",
                  "version": "2.0.0",
                  "request": "GetFeature",
                  "typenames": capa,
                  "outputFormat": "application/json",
                  "srsName": "EPSG:25830",
                  "bbox": bbox,
                  "count": 500
              }

              try:

                  r = requests.get(
                      url,
                      params=params,
                      timeout=120
                  )

                  r.raise_for_status()

                  data = r.json()

                  resultado["capas"][nombre] = {
                      "capa": capa,
                      "estado": "OK",
                      "numero_elementos": len(
                          data.get("features", [])
                      )
                  }

                  with open(
                      OUT / f"{nombre}.geojson",
                      "w",
                      encoding="utf-8"
                  ) as f:
                      json.dump(
                          data,
                          f,
                          ensure_ascii=False,
                          indent=2
                      )

              except Exception as e:

                  resultado["capas"][nombre] = {
                      "capa": capa,
                      "estado": "ERROR",
                      "error": str(e)
                  }

          with open(
              OUT / "agua.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  resultado,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("Agente agua terminado.")
          PY

      # ============================================================
      # 6. AGENTE SUELO
      # ============================================================

      - name: Crear agente suelo
        run: |
          cat > agentes/suelo.py <<'PY'
          import json
          import requests
          from pathlib import Path
          from pyproj import Transformer

          OUT = Path("expediente/suelo")
          OUT.mkdir(parents=True, exist_ok=True)

          with open("expediente/finca.json", encoding="utf-8") as f:
              finca = json.load(f)

          lat = finca["coordenadas"]["latitud"]
          lon = finca["coordenadas"]["longitud"]

          transformer = Transformer.from_crs(
              "EPSG:4326",
              "EPSG:25830",
              always_xy=True
          )

          x, y = transformer.transform(lon, lat)

          radio = finca["radio_busqueda_m"]

          bbox = f"{x-radio},{y-radio},{x+radio},{y+radio}"

          url = "https://idena.navarra.es/ogc/wfs"

          capas = {
              "mapa_suelos": "EDAFOL_Pol_Suelos25m",
              "clases_agrologicas": "AGRICU_Pol_CLAgrol25m",
              "subclases_agrologicas": "AGRICU_Pol_SCAgrol25m",
              "aptitud_riego": "REGADI_Pol_CLApti25m"
          }

          resultado = {
              "agente": "suelo",
              "estado": "OK",
              "bbox_utm": bbox,
              "capas": {}
          }

          for nombre, capa in capas.items():

              params = {
                  "service": "WFS",
                  "version": "2.0.0",
                  "request": "GetFeature",
                  "typenames": capa,
                  "outputFormat": "application/json",
                  "srsName": "EPSG:25830",
                  "bbox": bbox,
                  "count": 500
              }

              try:

                  r = requests.get(
                      url,
                      params=params,
                      timeout=120
                  )

                  r.raise_for_status()

                  data = r.json()

                  resultado["capas"][nombre] = {
                      "capa": capa,
                      "estado": "OK",
                      "numero_elementos": len(
                          data.get("features", [])
                      )
                  }

                  with open(
                      OUT / f"{nombre}.geojson",
                      "w",
                      encoding="utf-8"
                  ) as f:
                      json.dump(
                          data,
                          f,
                          ensure_ascii=False,
                          indent=2
                      )

              except Exception as e:

                  resultado["capas"][nombre] = {
                      "capa": capa,
                      "estado": "ERROR",
                      "error": str(e)
                  }

          resultado["advertencia"] = (
              "La cartografía de suelo no sustituye un análisis "
              "físico-químico realizado sobre muestras de campo."
          )

          with open(
              OUT / "suelo.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  resultado,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("Agente suelo terminado.")
          PY

      # ============================================================
      # 7. AGENTE VEGETACIÓN / USO DEL SUELO
      # ============================================================

      - name: Crear agente vegetación
        run: |
          cat > agentes/vegetacion.py <<'PY'
          import json
          import requests
          from pathlib import Path
          from pyproj import Transformer

          OUT = Path("expediente/vegetacion")
          OUT.mkdir(parents=True, exist_ok=True)

          with open("expediente/finca.json", encoding="utf-8") as f:
              finca = json.load(f)

          lat = finca["coordenadas"]["latitud"]
          lon = finca["coordenadas"]["longitud"]

          transformer = Transformer.from_crs(
              "EPSG:4326",
              "EPSG:25830",
              always_xy=True
          )

          x, y = transformer.transform(lon, lat)

          radio = finca["radio_busqueda_m"]

          bbox = f"{x-radio},{y-radio},{x+radio},{y+radio}"

          url = "https://idena.navarra.es/ogc/wfs"

          capas = {
              "mca_2023": "OCUPAC_Pol_MCA_VE2023"
          }

          resultado = {
              "agente": "vegetacion",
              "estado": "OK",
              "bbox_utm": bbox,
              "capas": {}
          }

          for nombre, capa in capas.items():

              params = {
                  "service": "WFS",
                  "version": "2.0.0",
                  "request": "GetFeature",
                  "typenames": capa,
                  "outputFormat": "application/json",
                  "srsName": "EPSG:25830",
                  "bbox": bbox,
                  "count": 500
              }

              try:

                  r = requests.get(
                      url,
                      params=params,
                      timeout=120
                  )

                  r.raise_for_status()

                  data = r.json()

                  resultado["capas"][nombre] = {
                      "capa": capa,
                      "estado": "OK",
                      "numero_elementos": len(
                          data.get("features", [])
                      )
                  }

                  with open(
                      OUT / f"{nombre}.geojson",
                      "w",
                      encoding="utf-8"
                  ) as f:
                      json.dump(
                          data,
                          f,
                          ensure_ascii=False,
                          indent=2
                      )

              except Exception as e:

                  resultado["capas"][nombre] = {
                      "capa": capa,
                      "estado": "ERROR",
                      "error": str(e)
                  }

          resultado["fuente"] = (
              "Mapa de Cultivos y Aprovechamientos de Navarra 2023"
          )

          with open(
              OUT / "vegetacion.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  resultado,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("Agente vegetación terminado.")
          PY

      # ============================================================
      # 8. AGENTE CLIMA
      # ============================================================

      - name: Crear agente clima
        run: |
          cat > agentes/clima.py <<'PY'
          import json
          import requests
          from pathlib import Path

          OUT = Path("expediente/clima")
          OUT.mkdir(parents=True, exist_ok=True)

          with open("expediente/finca.json", encoding="utf-8") as f:
              finca = json.load(f)

          lat = finca["coordenadas"]["latitud"]
          lon = finca["coordenadas"]["longitud"]

          url = "https://api.open-meteo.com/v1/forecast"

          params = {
              "latitude": lat,
              "longitude": lon,
              "current": ",".join([
                  "temperature_2m",
                  "relative_humidity_2m",
                  "precipitation",
                  "wind_speed_10m",
                  "wind_direction_10m"
              ]),
              "hourly": ",".join([
                  "temperature_2m",
                  "relative_humidity_2m",
                  "precipitation",
                  "wind_speed_10m",
                  "wind_direction_10m"
              ]),
              "daily": ",".join([
                  "temperature_2m_max",
                  "temperature_2m_min",
                  "precipitation_sum",
                  "wind_speed_10m_max"
              ]),
              "forecast_days": 7,
              "timezone": "Europe/Madrid"
          }

          resultado = {
              "agente": "clima",
              "estado": "OK",
              "coordenadas": {
                  "latitud": lat,
                  "longitud": lon
              }
          }

          try:

              r = requests.get(
                  url,
                  params=params,
                  timeout=60
              )

              r.raise_for_status()

              resultado["datos"] = r.json()

          except Exception as e:

              resultado["estado"] = "ERROR"
              resultado["error"] = str(e)

          with open(
              OUT / "clima.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  resultado,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("Agente clima terminado.")
          PY

      # ============================================================
      # 9. AGENTE SATÉLITE
      # ============================================================

      - name: Crear agente satélite
        run: |
          cat > agentes/satelite.py <<'PY'
          import json
          from pathlib import Path

          OUT = Path("expediente/satelite")
          OUT.mkdir(parents=True, exist_ok=True)

          resultado = {
              "agente": "satelite",
              "estado": "OK",
              "fuentes": {
                  "pnoa_historico": "https://www.ign.es/wms/pnoa-historico",
                  "pnoa_actual": "https://www.ign.es/wms-inspire/pnoa-ma",
                  "wmts_pnoa": "https://www.ign.es/wmts/pnoa-ma"
              },
              "objetivos": [
                  "comparación histórica",
                  "cambios de cobertura",
                  "vegetación",
                  "usos del suelo",
                  "seguimiento de regeneración"
              ]
          }

          with open(
              OUT / "satelite.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  resultado,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("Agente satélite preparado.")
          PY

      # ============================================================
      # 10. AGENTE NORMATIVA / TERRITORIO
      # ============================================================

      - name: Crear agente normativa
        run: |
          cat > agentes/normativa.py <<'PY'
          import json
          import requests
          from pathlib import Path
          from pyproj import Transformer

          OUT = Path("expediente/normativa")
          OUT.mkdir(parents=True, exist_ok=True)

          with open("expediente/finca.json", encoding="utf-8") as f:
              finca = json.load(f)

          lat = finca["coordenadas"]["latitud"]
          lon = finca["coordenadas"]["longitud"]

          transformer = Transformer.from_crs(
              "EPSG:4326",
              "EPSG:25830",
              always_xy=True
          )

          x, y = transformer.transform(lon, lat)

          radio = finca["radio_busqueda_m"]

          bbox = f"{x-radio},{y-radio},{x+radio},{y+radio}"

          url = "https://idena.navarra.es/ogc/wfs"

          capas = {
              "navarra_2000_zonas": "ESTADI_Pol_ZonNav2000",
              "navarra_2000_areas": "ESTADI_Pol_AreaNav2000",
              "navarra_2000_subzonas": "ESTADI_Pol_SzonNav2000"
          }

          resultado = {
              "agente": "normativa",
              "estado": "OK",
              "bbox_utm": bbox,
              "capas": {}
          }

          for nombre, capa in capas.items():

              params = {
                  "service": "WFS",
                  "version": "2.0.0",
                  "request": "GetFeature",
                  "typenames": capa,
                  "outputFormat": "application/json",
                  "srsName": "EPSG:25830",
                  "bbox": bbox,
                  "count": 500
              }

              try:

                  r = requests.get(
                      url,
                      params=params,
                      timeout=120
                  )

                  r.raise_for_status()

                  data = r.json()

                  resultado["capas"][nombre] = {
                      "capa": capa,
                      "estado": "OK",
                      "numero_elementos": len(
                          data.get("features", [])
                      )
                  }

                  with open(
                      OUT / f"{nombre}.geojson",
                      "w",
                      encoding="utf-8"
                  ) as f:
                      json.dump(
                          data,
                          f,
                          ensure_ascii=False,
                          indent=2
                      )

              except Exception as e:

                  resultado["capas"][nombre] = {
                      "capa": capa,
                      "estado": "ERROR",
                      "error": str(e)
                  }

          resultado["advertencia"] = (
              "La cartografía territorial no constituye por sí sola "
              "asesoramiento jurídico ni determina permisos concretos."
          )

          with open(
              OUT / "normativa.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  resultado,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("Agente normativa terminado.")
          PY

      # ============================================================
      # 11. AGENTE MAESTRO
      # ============================================================

      - name: Crear agente maestro
        run: |
          cat > agentes/maestro.py <<'PY'
          import subprocess
          import sys

          agentes = [
              "terreno.py",
              "parcelas.py",
              "agua.py",
              "suelo.py",
              "vegetacion.py",
              "clima.py",
              "satelite.py",
              "normativa.py"
          ]

          resultados = {}

          for agente in agentes:

              print("")
              print("=" * 70)
              print("EJECUTANDO:", agente)
              print("=" * 70)

              r = subprocess.run(
                  [sys.executable, "agentes/" + agente],
                  check=False
              )

              resultados[agente] = r.returncode

          print("")
          print("RESULTADO DE TODOS LOS AGENTES")

          for agente, codigo in resultados.items():
              print(
                  agente,
                  "OK" if codigo == 0 else f"ERROR {codigo}"
              )
          PY

      # ============================================================
      # 12. ANALISTA
      # ============================================================

      - name: Crear analista
        run: |
          cat > agentes/analista.py <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          base = Path("expediente")

          agentes = [
              "terreno",
              "parcelas",
              "agua",
              "suelo",
              "vegetacion",
              "clima",
              "satelite",
              "normativa"
          ]

          informe = {
              "fecha_utc": datetime.now(timezone.utc).isoformat(),
              "agentes": {},
              "resumen": {
                  "ok": 0,
                  "errores": 0,
                  "sin_datos": 0
              },
              "datos_faltantes": []
          }

          for agente in agentes:

              archivo = base / agente / f"{agente}.json"

              if not archivo.exists():

                  informe["agentes"][agente] = {
                      "estado": "SIN_RESULTADO"
                  }

                  informe["resumen"]["errores"] += 1
                  informe["datos_faltantes"].append(agente)
                  continue

              try:

                  with open(
                      archivo,
                      encoding="utf-8"
                  ) as f:
                      datos = json.load(f)

                  estado = datos.get(
                      "estado",
                      "DESCONOCIDO"
                  )

                  informe["agentes"][agente] = {
                      "estado": estado
                  }

                  if estado == "OK":
                      informe["resumen"]["ok"] += 1
                  elif estado == "ERROR":
                      informe["resumen"]["errores"] += 1
                      informe["datos_faltantes"].append(agente)
                  else:
                      informe["resumen"]["sin_datos"] += 1
                      informe["datos_faltantes"].append(agente)

              except Exception as e:

                  informe["agentes"][agente] = {
                      "estado": "ERROR",
                      "error": str(e)
                  }

                  informe["resumen"]["errores"] += 1
                  informe["datos_faltantes"].append(agente)

          informe["criterio"] = (
              "OK significa que el agente obtuvo una respuesta válida "
              "de su fuente. No significa que exista información "
              "suficiente para diseñar la finca."
          )

          informe["siguiente_fase"] = [
              "delimitar exactamente la finca",
              "calcular relieve",
              "calcular pendientes",
              "calcular orientación",
              "identificar agua",
              "analizar usos y vegetación",
              "analizar suelo",
              "analizar normativa",
              "integrar todas las capas",
              "preparar diseño de permacultura"
          ]

          with open(
              base / "analisis" / "informe_maestro.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  informe,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              json.dumps(
                  informe,
                  ensure_ascii=False,
                  indent=2
              )
          )
          PY

      # ============================================================
      # 13. EJECUTAR AGENTES
      # ============================================================

      - name: Ejecutar sistema maestro
        run: |
          python agentes/maestro.py

      - name: Ejecutar analista
        run: |
          python agentes/analista.py

      # ============================================================
      # 14. CREAR RESUMEN
      # ============================================================

      - name: Crear resumen de la finca
        run: |
          python - <<'PY'
          import json

          with open(
              "expediente/analisis/informe_maestro.json",
              encoding="utf-8"
          ) as f:
              informe = json.load(f)

          with open(
              "expediente/informes/resumen.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write("LURRA - SISTEMA MAESTRO DE LA FINCA\n")
              f.write("====================================\n\n")

              f.write(
                  "Coordenadas: 42.8962739, -1.5961049\n"
              )

              f.write(
                  "Altitud de referencia: 590.1082552 m\n"
              )

              f.write(
                  "Radio de análisis inicial: 1000 m\n\n"
              )

              f.write("AGENTES\n")
              f.write("=======\n")

              for nombre, datos in informe["agentes"].items():
                  f.write(
                      f"{nombre}: "
                      f"{datos.get('estado')}\n"
                  )

              f.write("\nRESUMEN\n")
              f.write("=======\n")

              for clave, valor in informe["resumen"].items():
                  f.write(
                      f"{clave}: {valor}\n"
                  )

              f.write("\nDATOS FALTANTES O PROBLEMÁTICOS\n")
              f.write("===============================\n")

              for dato in informe["datos_faltantes"]:
                  f.write(f"- {dato}\n")

              f.write("\nSIGUIENTE FASE\n")
              f.write("==============\n")

              for paso in informe["siguiente_fase"]:
                  f.write(f"- {paso}\n")
          PY

      # ============================================================
      # 15. MAPA WEB
      # ============================================================

      - name: Crear mapa web
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          with open(
              "expediente/finca.json",
              encoding="utf-8"
          ) as f:
              finca = json.load(f)

          lat = finca["coordenadas"]["latitud"]
          lon = finca["coordenadas"]["longitud"]

          html = f"""
          <!DOCTYPE html>
          <html lang="es">
          <head>
          <meta charset="utf-8">
          <meta name="viewport"
                content="width=device-width,initial-scale=1">
          <title>Lurra - Finca de permacultura</title>

          <link rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

          <style>
          html, body, #map {{
              height:100%;
              margin:0;
          }}

          #info {{
              position:absolute;
              z-index:1000;
              top:10px;
              left:10px;
              background:white;
              padding:14px;
              border-radius:8px;
              font-family:Arial,sans-serif;
              box-shadow:0 2px 10px rgba(0,0,0,.3);
          }}
          </style>
          </head>

          <body>

          <div id="info">
            <b>LURRA</b><br>
            Finca de permacultura<br><br>
            Latitud: {lat}<br>
            Longitud: {lon}<br>
            Altitud referencia: {finca["altitud_referencia_m"]} m
          </div>

          <div id="map"></div>

          <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

          <script>

          const lat = {lat};
          const lon = {lon};

          const map = L.map("map").setView(
              [lat, lon],
              15
          );

          L.tileLayer(
              "https://{{s}}.tile.openstreetmap.org/{{z}}/{{x}}/{{y}}.png",
              {{
                  attribution:
                    "&copy; OpenStreetMap contributors"
              }}
          ).addTo(map);

          L.marker([lat, lon])
            .addTo(map)
            .bindPopup(
              "<b>Punto de referencia de la finca</b><br>" +
              lat + ", " + lon
            )
            .openPopup();

          L.circle(
            [lat, lon],
            {{
              radius:1000,
              fill:false
            }}
          ).addTo(map);

          </script>

          </body>
          </html>
          """

          Path(
              "public/index.html"
          ).write_text(
              html,
              encoding="utf-8"
          )
          PY

