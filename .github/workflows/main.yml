name: Sistema Maestro de la Finca

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sistema-maestro:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar expediente
        run: |
          mkdir -p expediente/{terreno,agua,clima,suelo,vegetacion,satelite,parcelas,normativa,analisis,informes}
          mkdir -p agentes

          cat > expediente/finca.json <<'EOF'
          {
            "nombre": "Finca Lurra",
            "coordenadas": {
              "latitud": 42.8962739,
              "longitud": -1.5961049,
              "altitud_referencia_m": 590.1082552
            },
            "fuente_coordenadas": "Google Earth",
            "estado": "en_analisis"
          }
          EOF

      - name: Instalar herramientas
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Crear agente de terreno
        run: |
          cat > agentes/terreno.py <<'PY'
          import json
          import requests
          from pathlib import Path

          lat = 42.8962739
          lon = -1.5961049

          fuentes = {
              "mdt": "https://servicios.idee.es/wcs-inspire/mdt",
              "pendientes": "https://wms-pendientes.idee.es/pendientes"
          }

          resultado = {
              "agente": "terreno",
              "coordenadas": {"latitud": lat, "longitud": lon},
              "fuentes_oficiales": fuentes,
              "estado": "fuentes_verificadas",
              "datos_pendientes": [
                  "elevacion",
                  "pendiente",
                  "orientacion",
                  "curvas_de_nivel",
                  "modelo_3d"
              ]
          }

          Path("expediente/terreno/terreno.json").write_text(
              json.dumps(resultado, indent=2, ensure_ascii=False),
              encoding="utf-8"
          )
          print("Agente terreno ejecutado")
          PY

      - name: Crear agente de agua
        run: |
          cat > agentes/agua.py <<'PY'
          import json
          from pathlib import Path

          resultado = {
              "agente": "agua",
              "fuente_oficial": "https://servicios.idee.es/wfs-inspire/hidrografia",
              "estado": "fuente_preparada",
              "objetivos": [
                  "cauces",
                  "arroyos",
                  "rios",
                  "drenajes",
                  "cuencas",
                  "relacion_con_la_finca"
              ]
          }

          Path("expediente/agua/agua.json").write_text(
              json.dumps(resultado, indent=2, ensure_ascii=False),
              encoding="utf-8"
          )
          print("Agente agua ejecutado")
          PY

      - name: Crear agente de clima
        run: |
          cat > agentes/clima.py <<'PY'
          import json
          import requests
          from pathlib import Path

          lat = 42.8962739
          lon = -1.5961049

          url = (
              "https://api.open-meteo.com/v1/forecast"
              f"?latitude={lat}&longitude={lon}"
              "&current=temperature_2m,relative_humidity_2m,"
              "precipitation,wind_speed_10m,wind_direction_10m"
              "&daily=temperature_2m_max,temperature_2m_min,"
              "precipitation_sum,wind_speed_10m_max"
              "&timezone=Europe%2FMadrid"
          )

          datos = requests.get(url, timeout=30)
          datos.raise_for_status()

          resultado = {
              "agente": "clima",
              "coordenadas": {"latitud": lat, "longitud": lon},
              "fuente": "Open-Meteo",
              "datos": datos.json()
          }

          Path("expediente/clima/clima.json").write_text(
              json.dumps(resultado, indent=2, ensure_ascii=False),
              encoding="utf-8"
          )
          print("Agente clima ejecutado")
          PY

      - name: Crear agente de satélite
        run: |
          cat > agentes/satelite.py <<'PY'
          import json
          from pathlib import Path

          resultado = {
              "agente": "satelite",
              "fuentes_oficiales": {
                  "pnoa_actual": "https://www.ign.es/wms-inspire/pnoa-ma",
                  "pnoa_historico": "https://www.ign.es/wms/pnoa-historico",
                  "wmts_pnoa": "https://www.ign.es/wmts/pnoa-ma"
              },
              "estado": "fuentes_verificadas",
              "objetivos": [
                  "ortofoto_actual",
                  "ortofotos_historicas",
                  "cambios_del_terreno",
                  "cobertura_vegetal"
              ]
          }

          Path("expediente/satelite/satelite.json").write_text(
              json.dumps(resultado, indent=2, ensure_ascii=False),
              encoding="utf-8"
          )
          print("Agente satelite ejecutado")
          PY

      - name: Crear agente de parcelas
        run: |
          cat > agentes/parcelas.py <<'PY'
          import json
          from pathlib import Path

          resultado = {
              "agente": "parcelas",
              "coordenadas": {
                  "latitud": 42.8962739,
                  "longitud": -1.5961049
              },
              "fuente": "IDENA / Navarra",
              "servicio": "https://idena.navarra.es/ogc/wfs",
              "estado": "pendiente_de_identificacion",
              "objetivo": "localizar los recintos que contienen o rodean la finca"
          }

          Path("expediente/parcelas/parcelas.json").write_text(
              json.dumps(resultado, indent=2, ensure_ascii=False),
              encoding="utf-8"
          )
          print("Agente parcelas ejecutado")
          PY

      - name: Crear agente de suelo
        run: |
          cat > agentes/suelo.py <<'PY'
          import json
          from pathlib import Path

          resultado = {
              "agente": "suelo",
              "estado": "pendiente_de_fuente",
              "datos_necesarios": [
                  "tipo_de_suelo",
                  "textura",
                  "profundidad",
                  "materia_organica",
                  "pH",
                  "drenaje",
                  "capacidad_de_retencion_de_agua"
              ]
          }

          Path("expediente/suelo/suelo.json").write_text(
              json.dumps(resultado, indent=2, ensure_ascii=False),
              encoding="utf-8"
          )
          print("Agente suelo ejecutado")
          PY

      - name: Crear agente de vegetacion
        run: |
          cat > agentes/vegetacion.py <<'PY'
          import json
          from pathlib import Path

          resultado = {
              "agente": "vegetacion",
              "estado": "pendiente_de_datos",
              "objetivos": [
                  "cobertura_actual",
                  "masas_forestales",
                  "cultivos",
                  "matorral",
                  "zonas_abiertas",
                  "cambios_historicos"
              ]
          }

          Path("expediente/vegetacion/vegetacion.json").write_text(
              json.dumps(resultado, indent=2, ensure_ascii=False),
              encoding="utf-8"
          )
          print("Agente vegetacion ejecutado")
          PY

      - name: Crear agente de normativa
        run: |
          cat > agentes/normativa.py <<'PY'
          import json
          from pathlib import Path

          resultado = {
              "agente": "normativa",
              "estado": "pendiente_de_identificacion",
              "objetivos": [
                  "planeamiento",
                  "protecciones",
                  "espacios_naturales",
                  "cauces",
                  "servidumbres",
                  "usos_permitidos"
              ]
          }

          Path("expediente/normativa/normativa.json").write_text(
              json.dumps(resultado, indent=2, ensure_ascii=False),
              encoding="utf-8"
          )
          print("Agente normativa ejecutado")
          PY

      - name: Crear analista
        run: |
          cat > agentes/analista.py <<'PY'
          import json
          from pathlib import Path

          base = Path("expediente")
          resultados = {}

          for carpeta in base.iterdir():
              if carpeta.is_dir():
                  resultados[carpeta.name] = [
                      str(f.relative_to(base))
                      for f in carpeta.rglob("*")
                      if f.is_file()
                  ]

          informe = {
              "agente": "analista",
              "estado": "ejecutado",
              "expediente": resultados,
              "siguiente_fase": [
                  "completar_datos_reales",
                  "cruzar_capas",
                  "detectar_datos_faltantes",
                  "preparar_diseño_de_permacultura"
              ]
          }

          Path("expediente/analisis/informe.json").write_text(
              json.dumps(informe, indent=2, ensure_ascii=False),
              encoding="utf-8"
          )

          print("Analista ejecutado")
          PY

      - name: Ejecutar todos los agentes
        run: |
          python agentes/terreno.py
          python agentes/agua.py
          python agentes/clima.py
          python agentes/suelo.py
          python agentes/vegetacion.py
          python agentes/satelite.py
          python agentes/parcelas.py
          python agentes/normativa.py
          python agentes/analista.py

      - name: Generar resumen
        run: |
          echo "======================================"
          echo "     SISTEMA MAESTRO DE FINCA LURRA"
          echo "======================================"
          echo ""
          echo "Coordenadas:"
          echo "42.8962739, -1.5961049"
          echo ""
          echo "Agentes ejecutados:"
          echo "- Terreno"
          echo "- Agua"
          echo "- Clima"
          echo "- Suelo"
          echo "- Vegetación"
          echo "- Satélite"
          echo "- Parcelas"
          echo "- Normativa"
          echo "- Analista"
          echo ""
          echo "EXPEDIENTE GENERADO:"
          find expediente -type f | sort

      - name: Guardar expediente completo
        uses: actions/upload-artifact@v4
        with:
          name: expediente-finca-lurra-real
          path: expediente/

      - name: Guardar agentes
        uses: actions/upload-artifact@v4
        with:
          name: agentes-finca-lurra-real
          path: agentes/
