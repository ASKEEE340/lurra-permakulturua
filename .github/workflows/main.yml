name: Sistema Maestro de la Finca

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  sistema-maestro:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Crear KML de la finca
        run: |
          mkdir -p datos agentes expediente public
          cat > datos/finca.kml <<'KML'
          <?xml version="1.0" encoding="UTF-8"?>
          <kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>2026 LURRA</name><Placemark><name>Finca</name><Polygon><outerBoundaryIs><LinearRing><coordinates>-1.596431197218195,42.8968811808051,0 -1.596419122461621,42.89671664408164,0 -1.596417388715594,42.89663139381292,0 -1.596391107977928,42.89656291603366,0 -1.596312307142042,42.89633288164908,0 -1.596533407747146,42.89626720394415,0 -1.596628427351301,42.89623473699322,0 -1.596689088413235,42.89620962277233,0 -1.596696679394738,42.89618990559035,0 -1.596658020534545,42.89610877173172,0 -1.596332956684637,42.89576240136823,0 -1.59626531940508,42.89569443903466,0 -1.596107067682474,42.89577054664129,0 -1.595907295118593,42.89586756640147,0 -1.595758779237829,42.89591882794478,0 -1.596059672721568,42.89616500769569,0 -1.595851356400495,42.89631416046074,0 -1.595947449480188,42.89639274547473,0 -1.595951726480532,42.89639547208808,0 -1.595610189094819,42.89664924771686,0 -1.595591114087875,42.89665794963233,0 -1.595618407888095,42.89667388391324,0 -1.59567945240036,42.89670180403568,0 -1.595766305559175,42.89674833022713,0 -1.59593872384984,42.89684225847299,0 -1.595982016240013,42.89686324925874,0 -1.596148017644925,42.89687785146882,0 -1.596298573789157,42.89688214238888,0 -1.596431197218195,42.8968811808051,0</coordinates></LinearRing></outerBoundaryIs></Polygon></Placemark></Document></kml>
          KML

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check requests pyproj shapely

      - name: Crear agente maestro
        run: |
          cat > agentes/sistema_finca.py <<'PY'
          import json
          from pathlib import Path
          from xml.etree import ElementTree as ET
          import requests
          from pyproj import Geod
          from shapely.geometry import Polygon, shape, mapping
          
          ROOT = Path(__file__).resolve().parents[1]
          KML = ROOT / 'datos' / 'finca.kml'
          EXP = ROOT / 'expediente'
          LAT, LON, ALT_REF = 42.8962739, -1.5961049, 590.1082552
          
          def write_json(path, data):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')
          
          def get(url, **kwargs):
              try:
                  r = requests.get(url, timeout=40, **kwargs)
                  r.raise_for_status()
                  return r
              except Exception as e:
                  return e
          
          def read_kml_polygon():
              ns={'k':'http://www.opengis.net/kml/2.2'}
              root=ET.parse(KML).getroot()
              el=root.find('.//k:Polygon/k:outerBoundaryIs/k:LinearRing/k:coordinates', ns)
              if el is None:
                  raise RuntimeError('No se encontró un Polygon en el KML')
              pts=[]
              for token in el.text.split():
                  p=token.split(',')
                  pts.append((float(p[0]), float(p[1])))
              if pts[0] != pts[-1]:
                  pts.append(pts[0])
              return pts
          
          def geometry_agent():
              pts=read_kml_polygon()
              poly=Polygon(pts)
              if not poly.is_valid:
                  poly=poly.buffer(0)
              geod=Geod(ellps='WGS84')
              area, perimeter = geod.geometry_area_perimeter(poly)
              result={'nombre':'2026 LURRA','vertices':len(pts)-1,'area_m2':abs(area),'area_ha':abs(area)/10000,'perimetro_m':abs(perimeter),'latitud_referencia':LAT,'longitud_referencia':LON,'altitud_referencia_m':ALT_REF,'epsg':'EPSG:4326'}
              write_json(EXP/'geometria'/'finca.json', result)
              write_json(EXP/'geometria'/'finca.geojson', {'type':'FeatureCollection','features':[{'type':'Feature','properties':result,'geometry':mapping(poly)}]})
              return poly, result
          
          def climate_agent():
              params={'latitude':LAT,'longitude':LON,'current':'temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m,wind_direction_10m','daily':'temperature_2m_max,temperature_2m_min,precipitation_sum,windspeed_10m_max','forecast_days':7,'timezone':'Europe/Madrid'}
              r=get('https://api.open-meteo.com/v1/forecast', params=params)
              if isinstance(r, Exception):
                  return {'agente':'clima','estado':'ERROR','error':str(r)}
              data=r.json()
              write_json(EXP/'clima'/'open-meteo.json',data)
              return {'agente':'clima','estado':'OK','elevacion_modelo_m':data.get('elevation')}
          
          def wfs_agent(name, layer, folder, poly):
              minx,miny,maxx,maxy=poly.bounds
              params={'service':'WFS','version':'2.0.0','request':'GetFeature','typeNames':'IDENA:'+layer,'outputFormat':'application/json','srsName':'EPSG:4326','bbox':f'{minx},{miny},{maxx},{maxy},EPSG:4326','count':1000}
              r=get('https://idena.navarra.es/ogc/wfs', params=params)
              out={'agente':name,'capa':layer}
              if isinstance(r, Exception):
                  out.update(estado='ERROR',error=str(r))
                  write_json(EXP/folder/(layer+'.json'),out)
                  return out
              try:
                  data=r.json()
                  feats=[]
                  for f in data.get('features',[]):
                      try:
                          if shape(f.get('geometry')).intersects(poly):
                              feats.append(f)
                      except Exception:
                          pass
                  write_json(EXP/folder/(layer+'.json'), {'type':'FeatureCollection','features':feats,'source_numberMatched':data.get('numberMatched')})
                  out.update(estado='OK',en_bbox=len(data.get('features',[])),dentro_finca=len(feats))
              except Exception as e:
                  out.update(estado='ERROR',error=str(e))
              return out
          
          def terrain_agent():
              url='https://api-coverages.idee.es/collections/EL.ElevationGridCoverage_4258_5_PB'
              r=get(url, params={'f':'json'})
              out={'agente':'terreno','fuente':url}
              if isinstance(r, Exception):
                  out.update(estado='ERROR',error=str(r))
              else:
                  write_json(EXP/'terreno'/'mdt5m-metadata.json', r.json())
                  out['estado']='OK'
              return out
          
          def satellite_agent(poly):
              minx,miny,maxx,maxy=poly.bounds
              body={'bbox':[minx,miny,maxx,maxy],'datetime':'2024-01-01T00:00:00Z/..','collections':['sentinel-2-l2a'],'limit':50}
              try:
                  r=requests.post('https://catalogue.dataspace.copernicus.eu/stac/search',json=body,timeout=50)
                  r.raise_for_status()
                  data=r.json()
                  write_json(EXP/'satelite'/'sentinel2-stac.json',data)
                  return {'agente':'satelite','estado':'OK','elementos':len(data.get('features',[]))}
              except Exception as e:
                  out={'agente':'satelite','estado':'ERROR','error':str(e)}
                  write_json(EXP/'satelite'/'resultado.json',out)
                  return out
          
          def make_map(poly):
              gj=json.dumps({'type':'Feature','properties':{},'geometry':mapping(poly)},ensure_ascii=False)
              html='''<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finca Lurra</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{height:100%;margin:0}</style></head><body><div id="map"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const finca=GEOJSON;const m=L.map('map').setView([LAT,LON],17);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap'}).addTo(m);const c=L.geoJSON(finca).addTo(m);m.fitBounds(c.getBounds());L.marker([LAT,LON]).addTo(m).bindPopup('Punto de referencia');</script></body></html>'''
              html=html.replace('GEOJSON',gj).replace('LAT',str(LAT)).replace('LON',str(LON))
              (ROOT/'public').mkdir(exist_ok=True)
              (ROOT/'public'/'index.html').write_text(html,encoding='utf-8')
          
          def main():
              poly, geom = geometry_agent()
              results=[{'agente':'geometria','estado':'OK','datos':geom}, terrain_agent(), climate_agent()]
              layers=[
                ('agua','CARBTU_Lin_Hidrografia_201','agua'),
                ('agua_superficial','CARBTU_Pol_Hidrografia_201','agua'),
                ('vegetacion','OCUPAC_Pol_MCA_VE2023','vegetacion'),
                ('suelo','EDAFOL_Pol_Suelos25m','suelo'),
                ('agricultura','AGRICU_Pol_CLAgrol25m','suelo'),
                ('regulacion','ESTADI_Pol_ZonNav2000','normativa'),
                ('regulacion_area','ESTADI_Pol_AreaNav2000','normativa'),
                ('regulacion_subzona','ESTADI_Pol_SzonNav2000','normativa')
              ]
              for x in layers:
                  results.append(wfs_agent(*x, poly))
              results.append(satellite_agent(poly))
              write_json(EXP/'analisis'/'estado-agentes.json',results)
              ok=sum(1 for x in results if x.get('estado')=='OK')
              err=len(results)-ok
              write_json(EXP/'analisis'/'resumen.json',{'finca':geom,'agentes':len(results),'ok':ok,'errores':err,'nota':'OK = fuente respondió; se distingue de cobertura encontrada dentro de la finca.'})
              (EXP/'informes').mkdir(parents=True,exist_ok=True)
              (EXP/'informes'/'resumen.txt').write_text(f"FINCA LURRA\nSuperficie: {geom['area_m2']:.2f} m2 ({geom['area_ha']:.4f} ha)\nPerimetro: {geom['perimetro_m']:.2f} m\nAgentes ejecutados: {len(results)} | OK: {ok} | ERROR: {err}\n",encoding='utf-8')
              make_map(poly)
              print(json.dumps({'superficie_m2':geom['area_m2'],'superficie_ha':geom['area_ha'],'agentes':len(results),'ok':ok,'errores':err},ensure_ascii=False,indent=2))
          
          if __name__=='__main__':
              main()
          PY

      - name: Ejecutar sistema maestro
        run: python agentes/sistema_finca.py

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publicar mapa
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Desplegar GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Guardar expediente
        uses: actions/upload-artifact@v4
        with:
          name: expediente-finca-lurra-final
          path: expediente/

      - name: Guardar sistema y geometria
        uses: actions/upload-artifact@v4
        with:
          name: sistema-finca-lurra-final
          path: |
            agentes/
            datos/finca.kml
