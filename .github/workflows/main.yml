name: Sistema Maestro de la Finca

on:
  workflow_dispatch:
    inputs:
      publicar_pagina:
        description: Publicar el mapa en GitHub Pages
        type: boolean
        default: true
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: finca-lurra
  cancel-in-progress: false

jobs:
  analisis:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Crear KML de la finca
        run: |
          mkdir -p datos agentes expediente public
          cat > datos/finca.kml <<'KML'
          <?xml version="1.0" encoding="UTF-8"?>
          <kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>2026 LURRA</name><Placemark><name>Finca</name><Polygon><outerBoundaryIs><LinearRing><coordinates>-1.596431197218195,42.8968811808051,0 -1.596419122461621,42.89671664408164,0 -1.596417388715594,42.89663139381292,0 -1.596391107977928,42.89656291603366,0 -1.596312307142042,42.89633288164908,0 -1.596533407747146,42.89626720394415,0 -1.596628427351301,42.89623473699322,0 -1.596689088413235,42.89620962277233,0 -1.596696679394738,42.89618990559035,0 -1.596658020534545,42.89610877173172,0 -1.596332956684637,42.89576240136823,0 -1.59626531940508,42.89569443903466,0 -1.596107067682474,42.89577054664129,0 -1.595907295118593,42.89586756640147,0 -1.595758779237829,42.89591882794478,0 -1.596059672721568,42.89616500769569,0 -1.595851356400495,42.89631416046074,0 -1.595947449480188,42.89639274547473,0 -1.595951726480532,42.89639547208808,0 -1.595610189094819,42.89664924771686,0 -1.595591114087875,42.89665794963233,0 -1.595618407888095,42.89667388391324,0 -1.59567945240036,42.89670180403568,0 -1.595766305559175,42.89674833022713,0 -1.59593872384984,42.89684225847299,0 -1.595982016240013,42.89686324925874,0 -1.596148017644925,42.89687785146882,0 -1.596298573789157,42.89688214238888,0 -1.596431197218195,42.8968811808051,0</coordinates></LinearRing></outerBoundaryIs></Polygon></Placemark></Document></kml>
          KML

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check requests pyproj "shapely>=2" rasterio numpy scikit-image

      - name: Crear agente maestro
        run: |
          cat > agentes/sistema_finca.py <<'PY'
          import json
          import os
          import re
          from datetime import date, timedelta
          from pathlib import Path
          from xml.etree import ElementTree as ET

          import requests
          from pyproj import Geod, Transformer
          from shapely.geometry import LineString, MultiPolygon, Polygon, mapping, shape
          from shapely.ops import transform as shp_transform, unary_union

          ROOT = Path(__file__).resolve().parents[1]
          KML = ROOT / 'datos' / 'finca.kml'
          EXP = ROOT / 'expediente'
          PUB = ROOT / 'public'
          LAT, LON, ALT_REF = 42.8962739, -1.5961049, 590.1082552
          HEADERS = {'User-Agent': 'finca-lurra-workflow/2.0'}
          WFS_URL = 'https://idena.navarra.es/ogc/wfs'

          # Navarra: trabajamos en ETRS89 / UTM 30N (EPSG:25830) para medir y para consultar IDENA
          TO_UTM = Transformer.from_crs('EPSG:4326', 'EPSG:25830', always_xy=True).transform
          TO_WGS = Transformer.from_crs('EPSG:25830', 'EPSG:4326', always_xy=True).transform

          CAPAS_SERVIDOR = set()
          MAPA_CAPAS = {}

          CAPAS = [
              ('agua', 'CARBTU_Lin_Hidrografia_201', 'agua'),
              ('agua_superficial', 'CARBTU_Pol_Hidrografia_201', 'agua'),
              ('vegetacion', 'OCUPAC_Pol_MCA_VE2023', 'vegetacion'),
              ('suelo', 'EDAFOL_Pol_Suelos25m', 'suelo'),
              ('agricultura', 'AGRICU_Pol_CLAgrol25m', 'suelo'),
              ('zonificacion', 'ESTADI_Pol_ZonNav2000', 'zonificacion'),
              ('zonificacion_area', 'ESTADI_Pol_AreaNav2000', 'zonificacion'),
              ('zonificacion_subzona', 'ESTADI_Pol_SzonNav2000', 'zonificacion'),
          ]


          def write_json(path, data):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')


          def http(method, url, **kw):
              r = requests.request(method, url, timeout=90, headers=HEADERS, **kw)
              r.raise_for_status()
              return r


          def ejecutar(nombre, fn, *args):
              """Ejecuta un agente; si falla, lo registra como ERROR sin tumbar al resto."""
              try:
                  res = fn(*args)
              except Exception as e:
                  res = {'estado': 'ERROR', 'resumen': f'{type(e).__name__}: {str(e)[:300]}'}
              res['agente'] = nombre
              return res


          # ---------- Geometria ----------
          def read_polygon():
              ns = {'k': 'http://www.opengis.net/kml/2.2'}
              el = ET.parse(KML).getroot().find('.//k:Polygon/k:outerBoundaryIs/k:LinearRing/k:coordinates', ns)
              if el is None:
                  raise RuntimeError('No se encontro un Polygon en el KML')
              pts = [tuple(float(v) for v in t.split(',')[:2]) for t in el.text.split()]
              poly = Polygon(pts)
              if not poly.is_valid:
                  poly = poly.buffer(0)
              if isinstance(poly, MultiPolygon):
                  poly = max(poly.geoms, key=lambda g: g.area)
              return poly


          def agent_geometria(poly, poly_utm):
              area, per = Geod(ellps='WGS84').geometry_area_perimeter(poly)
              datos = {
                  'nombre': '2026 LURRA',
                  'vertices': len(poly.exterior.coords) - 1,
                  'area_m2': abs(area),
                  'area_ha': abs(area) / 10000,
                  'area_utm25830_m2': poly_utm.area,
                  'perimetro_m': abs(per),
                  'latitud_referencia': LAT,
                  'longitud_referencia': LON,
                  'altitud_referencia_m': ALT_REF,
              }
              write_json(EXP / 'geometria' / 'finca.json', datos)
              write_json(EXP / 'geometria' / 'finca.geojson',
                         {'type': 'FeatureCollection',
                          'features': [{'type': 'Feature', 'properties': datos, 'geometry': mapping(poly)}]})
              return datos


          # ---------- Clima ----------
          def agent_clima():
              fc = http('GET', 'https://api.open-meteo.com/v1/forecast', params={
                  'latitude': LAT, 'longitude': LON,
                  'current': 'temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m,wind_direction_10m',
                  'daily': 'temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max',
                  'forecast_days': 7, 'timezone': 'Europe/Madrid'}).json()
              write_json(EXP / 'clima' / 'prevision-7d.json', fc)

              hoy = date.today()
              h = http('GET', 'https://archive-api.open-meteo.com/v1/archive', params={
                  'latitude': LAT, 'longitude': LON,
                  'start_date': (hoy - timedelta(days=365)).isoformat(),
                  'end_date': (hoy - timedelta(days=7)).isoformat(),
                  'daily': 'temperature_2m_max,temperature_2m_min,temperature_2m_mean,precipitation_sum',
                  'timezone': 'Europe/Madrid'}).json()
              write_json(EXP / 'clima' / 'historico-12m.json', h)

              d = h['daily']
              tmin = [x for x in d['temperature_2m_min'] if x is not None]
              tmax = [x for x in d['temperature_2m_max'] if x is not None]
              tmed = [x for x in d['temperature_2m_mean'] if x is not None]
              prec = [x for x in d['precipitation_sum'] if x is not None]
              p = fc['daily']
              resumen = (
                  f"Ultimos 12 meses: lluvia {sum(prec):.0f} mm; temperatura media {sum(tmed) / len(tmed):.1f} C; "
                  f"dias de helada (min<=0): {sum(1 for x in tmin if x <= 0)}; dias calurosos (max>=30): {sum(1 for x in tmax if x >= 30)}\n"
                  f"Proximos 7 dias: {min(p['temperature_2m_min']):.0f} a {max(p['temperature_2m_max']):.0f} C; "
                  f"lluvia prevista {sum(x or 0 for x in p['precipitation_sum']):.1f} mm"
              )
              return {'estado': 'OK', 'resumen': resumen}


          # ---------- Terreno: MDT 5 m del IGN (descarga, pendiente, orientacion, curvas) ----------
          def agent_terreno(poly_utm):
              import numpy as np
              import rasterio
              from rasterio.features import geometry_mask
              from skimage.measure import find_contours

              pad = 25
              minx, miny, maxx, maxy = poly_utm.bounds
              r = http('GET', 'https://api-coverages.idee.es/collections/EL.ElevationGridCoverage_25830_5_PB/coverage',
                       params={'subset': f'x({minx - pad}:{maxx + pad}),y({miny - pad}:{maxy + pad})', 'f': 'COG'})
              out = EXP / 'terreno'
              out.mkdir(parents=True, exist_ok=True)
              raw = out / 'mdt5m_descarga.tif'
              raw.write_bytes(r.content)

              with rasterio.open(raw) as src:
                  elev = src.read(1).astype('float64')
                  tr, meta, nod = src.transform, src.meta.copy(), src.nodata
              if nod is not None:
                  elev[elev == nod] = np.nan
              elev[elev < -1000] = np.nan

              # Pendiente y orientacion sobre toda la ventana descargada (con margen), y despues se recorta a la finca.
              # Asi las celdas del borde de la finca tambien tienen valor.
              dzdy, dzdx = np.gradient(elev, abs(tr.e), abs(tr.a))
              slope = np.degrees(np.arctan(np.hypot(dzdx, dzdy)))
              aspect = (np.degrees(np.arctan2(-dzdx, dzdy)) + 360) % 360
              dentro = geometry_mask([mapping(poly_utm)], out_shape=elev.shape, transform=tr, invert=True)
              ok = dentro & np.isfinite(elev) & np.isfinite(slope)
              if ok.sum() < 10:
                  raise RuntimeError('El MDT descargado no cubre la finca')

              def guardar(nombre, arr):
                  m = meta.copy()
                  m.update(driver='GTiff', dtype='float32', count=1, nodata=-9999, compress='deflate')
                  with rasterio.open(out / nombre, 'w', **m) as d:
                      d.write(np.where(ok, np.nan_to_num(arr, nan=-9999), -9999).astype('float32'), 1)
              guardar('mdt5m_finca.tif', elev)
              guardar('pendiente_grados.tif', slope)
              guardar('orientacion_grados.tif', aspect)

              z, s = elev[ok], slope[ok]
              pct = np.tan(np.radians(s)) * 100
              clases = [('<5', s < 5), ('5-10', (s >= 5) & (s < 10)), ('10-15', (s >= 10) & (s < 15)), ('>=15', s >= 15)]
              reparto = ', '.join(f'{n} grados: {m.mean() * 100:.0f}%' for n, m in clases)
              nombres = ['N', 'NE', 'E', 'SE', 'S', 'SO', 'O', 'NO']
              a = aspect[ok][s >= 2]
              if a.size:
                  idx = ((a + 22.5) // 45 % 8).astype(int)
                  cuentas = np.bincount(idx, minlength=8)
                  orden = np.argsort(cuentas)[::-1]
                  orient = ', '.join(f'{nombres[i]} {cuentas[i] / a.size * 100:.0f}%' for i in orden[:2] if cuentas[i])
              else:
                  orient = 'terreno casi llano'

              # Curvas de nivel (multiplos de 1 m y de 5 m) recortadas a la finca
              relleno = np.where(np.isfinite(elev), elev, np.nanmean(elev))
              for intervalo, etiqueta in ((1, 'curvas 1 m'), (5, 'curvas 5 m')):
                  feats = []
                  for nivel in range(int(np.floor(z.min())), int(np.ceil(z.max())) + 1):
                      if nivel % intervalo:
                          continue
                      for c in find_contours(relleno, nivel):
                          if len(c) < 2:
                              continue
                          coords = [(tr.c + (col + 0.5) * tr.a, tr.f + (row + 0.5) * tr.e) for row, col in c]
                          linea = LineString(coords).intersection(poly_utm)
                          if linea.is_empty or 'Line' not in linea.geom_type or linea.length < 1:
                              continue
                          feats.append({'type': 'Feature', 'properties': {'elevacion_m': float(nivel)},
                                        'geometry': mapping(shp_transform(TO_WGS, linea))})
                  fc = {'type': 'FeatureCollection', 'features': feats}
                  write_json(out / (etiqueta.replace(' ', '_') + '.geojson'), fc)
                  if intervalo == 5:
                      MAPA_CAPAS['terreno: ' + etiqueta] = fc

              datos = {'fuente': 'IGN MDT 5 m (IDEE api-coverages)', 'celdas_finca': int(ok.sum()),
                       'alt_min': float(z.min()), 'alt_max': float(z.max()), 'alt_media': float(z.mean()),
                       'pendiente_media_grados': float(s.mean()), 'pendiente_media_pct': float(pct.mean()),
                       'pendiente_max_grados': float(s.max())}
              write_json(out / 'topografia.json', datos)
              resumen = (f"MDT de 5 m del IGN: {int(ok.sum())} celdas dentro de la finca\n"
                         f"- Altitud {z.min():.1f}-{z.max():.1f} m (media {z.mean():.1f}); desnivel {z.max() - z.min():.1f} m\n"
                         f"- Pendiente media {s.mean():.1f} grados ({pct.mean():.0f}%), maxima {s.max():.1f} grados\n"
                         f"- Reparto de la superficie por pendiente: {reparto}\n"
                         f"- Orientacion (hacia donde mira la ladera): {orient}")
              return {'estado': 'OK', 'resumen': resumen}


          # ---------- IDENA (WFS) ----------
          def agent_capacidades():
              r = http('GET', WFS_URL, params={'service': 'WFS', 'version': '2.0.0', 'request': 'GetCapabilities'})
              nombres = sorted({n.split(':')[-1] for n in re.findall(r'<(?:\w+:)?Name>([^<]+)</', r.text)})
              (EXP / 'analisis').mkdir(parents=True, exist_ok=True)
              (EXP / 'analisis' / 'idena-capas-disponibles.txt').write_text('\n'.join(nombres), encoding='utf-8')
              CAPAS_SERVIDOR.update(nombres)
              if not nombres:
                  return {'estado': 'SIN_DATOS', 'resumen': 'El servidor respondio pero no se pudo leer la lista de capas'}
              return {'estado': 'OK', 'resumen': f'El servidor publica {len(nombres)} capas (lista en idena-capas-disponibles.txt)'}


          def resumir_props(props):
              ocultar = {'FEATURE', 'CRECINTO', 'GEOM_AREA', 'GEOM_PERI', 'BEGINLIFE', 'CGRUPO', 'CZONA', 'CSUBZONA', 'CAREA'}
              items = [(k, v) for k, v in props.items() if v not in (None, '') and k not in ocultar and not k.startswith('interseccion')][:6]
              return '; '.join(f'{k}={str(v)[:50]}' for k, v in items)


          def agent_wfs(nombre, capa, carpeta, poly_utm):
              if CAPAS_SERVIDOR and capa not in CAPAS_SERVIDOR:
                  return {'estado': 'ERROR', 'resumen': f'La capa {capa} no aparece en el GetCapabilities (ver idena-capas-disponibles.txt)'}
              minx, miny, maxx, maxy = shp_transform(TO_WGS, poly_utm).bounds
              r = http('GET', WFS_URL, params={
                  'service': 'WFS', 'version': '2.0.0', 'request': 'GetFeature',
                  'typeNames': 'IDENA:' + capa, 'outputFormat': 'application/json',
                  'srsName': 'EPSG:4326', 'bbox': f'{minx},{miny},{maxx},{maxy},EPSG:4326',
                  'count': 1000})
              try:
                  data = r.json()
              except ValueError:
                  raise RuntimeError('El servidor no devolvio JSON: ' + ' '.join(r.text[:300].split()))

              dentro, ejemplos, medida_total, es_area = [], [], 0.0, True
              for f in data.get('features', []):
                  if not f.get('geometry'):
                      continue
                  g = shape(f['geometry'])
                  if g.bounds[0] < 1000:  # llegaron en grados: pasar a UTM
                      g = shp_transform(TO_UTM, g)
                  if not g.is_valid:
                      g = g.buffer(0)
                  inter = g.intersection(poly_utm)
                  if inter.is_empty:
                      continue
                  props = dict(f.get('properties') or {})
                  if 'Polygon' in g.geom_type:
                      if inter.area < 0.5:
                          continue
                      props['interseccion_m2'] = round(inter.area, 1)
                      medida_total += inter.area
                  elif 'Line' in g.geom_type:
                      if inter.length < 0.1:
                          continue
                      es_area = False
                      props['interseccion_m'] = round(inter.length, 1)
                      medida_total += inter.length
                  dentro.append((inter, props))
                  if len(ejemplos) < 5:
                      ejemplos.append(resumir_props(props))

              fc = {'type': 'FeatureCollection', 'features': [
                  {'type': 'Feature', 'properties': p, 'geometry': mapping(shp_transform(TO_WGS, g))} for g, p in dentro]}
              write_json(EXP / carpeta / (capa + '.geojson'), fc)
              if not dentro:
                  return {'estado': 'SIN_DATOS',
                          'resumen': f"El servidor respondio ({len(data.get('features', []))} elementos en la zona) pero ninguno cae dentro de la finca"}
              MAPA_CAPAS[f'{nombre}: {capa}'] = fc
              if es_area:
                  cobertura = unary_union([g for g, _ in dentro]).area / poly_utm.area * 100
                  cabecera = f'{len(dentro)} elementos dentro de la finca, cubren {min(cobertura, 100):.1f}% de la superficie'
              else:
                  cabecera = f'{len(dentro)} tramos dentro de la finca, {medida_total:.0f} m en total'
              return {'estado': 'OK', 'resumen': cabecera + '\n' + '\n'.join('- ' + e for e in ejemplos)}


          # ---------- Satelite: NDVI real ----------
          def agent_satelite(poly):
              import rasterio
              from rasterio.mask import mask

              hoy = date.today()
              body = {'collections': ['sentinel-2-l2a'], 'bbox': list(poly.bounds),
                      'datetime': f'{(hoy - timedelta(days=60)).isoformat()}T00:00:00Z/{hoy.isoformat()}T23:59:59Z',
                      'query': {'eo:cloud_cover': {'lt': 20}},
                      'sortby': [{'field': 'properties.datetime', 'direction': 'desc'}], 'limit': 10}
              data = http('POST', 'https://earth-search.aws.element84.com/v1/search', json=body).json()
              items = data.get('features', [])
              if not items:
                  return {'estado': 'SIN_DATOS', 'resumen': 'Ninguna escena Sentinel-2 con menos de 20% de nubes en los ultimos 60 dias'}

              resultados = []
              with rasterio.Env(GDAL_DISABLE_READDIR_ON_OPEN='EMPTY_DIR', GDAL_HTTP_MAX_RETRY='3', GDAL_HTTP_RETRY_DELAY='2'):
                  for it in items[:3]:
                      try:
                          bandas = {}
                          for clave in ('red', 'nir'):
                              a = it['assets'][clave]
                              with rasterio.open(a['href']) as ds:
                                  to_ds = Transformer.from_crs('EPSG:4326', ds.crs, always_xy=True).transform
                                  arr, _ = mask(ds, [mapping(shp_transform(to_ds, poly))], crop=True, all_touched=True, nodata=0)
                              rb = (a.get('raster:bands') or [{}])[0]
                              bandas[clave] = (arr[0].astype('float64'), rb.get('scale', 0.0001), rb.get('offset', -0.1))
                          red, sr, orr = bandas['red']
                          nir, sn, onn = bandas['nir']
                          valido = (red > 0) & (nir > 0)
                          if valido.sum() < 10:
                              raise RuntimeError('Pocos pixeles validos dentro de la finca')
                          rr = red[valido] * sr + orr
                          nn = nir[valido] * sn + onn
                          ndvi = (nn - rr) / (nn + rr)
                          resultados.append({'escena': it['id'], 'fecha': it['properties']['datetime'][:10],
                                             'nubes_pct': it['properties'].get('eo:cloud_cover'),
                                             'pixeles': int(valido.sum()), 'ndvi_medio': float(ndvi.mean()),
                                             'ndvi_min': float(ndvi.min()), 'ndvi_max': float(ndvi.max())})
                      except Exception as e:
                          resultados.append({'escena': it['id'], 'error': f'{type(e).__name__}: {str(e)[:150]}'})
              write_json(EXP / 'satelite' / 'ndvi.json', resultados)
              buenos = [x for x in resultados if 'ndvi_medio' in x]
              if not buenos:
                  return {'estado': 'ERROR', 'resumen': 'Hay escenas pero no se pudo leer ninguna: ' + resultados[0].get('error', '')}
              lineas = [f"- {x['fecha']}: NDVI medio {x['ndvi_medio']:.2f} (rango {x['ndvi_min']:.2f} a {x['ndvi_max']:.2f}), "
                        f"nubes {x['nubes_pct']:.0f}%, {x['pixeles']} pixeles de 10 m" for x in buenos]
              return {'estado': 'OK', 'resumen': 'NDVI calculado sobre la finca (Sentinel-2)\n' + '\n'.join(lineas)}


          # ---------- Salida ----------
          PLANTILLA = '''<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finca Lurra</title>
          <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
          <style>html,body,#map{height:100%;margin:0}#panel{position:absolute;top:10px;right:10px;z-index:1000;background:#fffffff2;padding:8px 12px;border-radius:6px;max-width:min(520px,85vw);max-height:80vh;overflow:auto;font:13px system-ui}#panel pre{white-space:pre-wrap;margin:6px 0 0}</style></head>
          <body><div id="map"></div><details id="panel"><summary><b>Informe</b></summary><pre id="inf"></pre></details>
          <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
          <script>
          const D=__DATA__;
          const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
          const m=L.map('map');
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap'}).addTo(m);
          const finca=L.geoJSON(D.finca,{style:{color:'#d00',weight:3,fillOpacity:0.05}}).addTo(m);
          m.fitBounds(finca.getBounds());
          L.marker(D.ref).addTo(m).bindPopup('Punto de referencia');
          const col=['#1f78b4','#33a02c','#ff7f00','#6a3d9a','#b15928','#e31a1c','#17becf','#8c564b'];
          const capas={'Finca':finca};let i=0;
          for(const [n,fc] of Object.entries(D.capas)){
            capas[n]=L.geoJSON(fc,{style:{color:col[i++%col.length],weight:2,fillOpacity:0.3},
              onEachFeature:(f,l)=>l.bindPopup(Object.entries(f.properties).filter(([k,v])=>v!==null&&v!=='').slice(0,12).map(([k,v])=>esc(k)+': '+esc(v)).join('<br>'))});
          }
          L.control.layers(null,capas,{collapsed:false}).addTo(m);
          document.getElementById('inf').textContent=D.informe;
          </script></body></html>'''


          def make_map(poly, informe):
              datos = {'finca': {'type': 'Feature', 'properties': {}, 'geometry': mapping(poly)},
                       'capas': MAPA_CAPAS, 'ref': [LAT, LON], 'informe': informe}
              txt = json.dumps(datos, ensure_ascii=False).replace('</', '<\\/')
              PUB.mkdir(exist_ok=True)
              (PUB / 'index.html').write_text(PLANTILLA.replace('__DATA__', txt), encoding='utf-8')


          def construir_informe(geom, resultados, cuenta):
              L = ['# Finca Lurra - informe automatico', f'Generado: {date.today().isoformat()}', '',
                   '## Geometria',
                   f"- Superficie: {geom['area_m2']:.0f} m2 ({geom['area_ha']:.4f} ha)",
                   f"- Perimetro: {geom['perimetro_m']:.0f} m ({geom['vertices']} vertices)", '',
                   f"## Agentes: {cuenta['OK']} OK, {cuenta['SIN_DATOS']} sin datos, {cuenta['ERROR']} con error",
                   'OK = hay datos reales de la finca. SIN_DATOS = la fuente respondio pero no hay nada dentro de la finca. ERROR = fallo tecnico.', '']
              for r in resultados:
                  L.append(f"### {r['agente']} - {r['estado']}")
                  L.extend(r.get('resumen', '').split('\n'))
                  L.append('')
              return '\n'.join(L)


          def main():
              poly = read_polygon()
              poly_utm = shp_transform(TO_UTM, poly)
              geom = agent_geometria(poly, poly_utm)

              resultados = [ejecutar('clima', agent_clima),
                            ejecutar('terreno (MDT 5 m)', agent_terreno, poly_utm),
                            ejecutar('idena-capas', agent_capacidades)]
              for nombre, capa, carpeta in CAPAS:
                  resultados.append(ejecutar(f'{nombre}: {capa}', agent_wfs, nombre, capa, carpeta, poly_utm))
              resultados.append(ejecutar('satelite-ndvi', agent_satelite, poly))

              cuenta = {'OK': 0, 'SIN_DATOS': 0, 'ERROR': 0}
              for r in resultados:
                  cuenta[r['estado']] += 1
              write_json(EXP / 'analisis' / 'estado-agentes.json', resultados)
              write_json(EXP / 'analisis' / 'resumen.json', {'finca': geom, 'agentes': len(resultados), **cuenta})

              informe = construir_informe(geom, resultados, cuenta)
              (EXP / 'informes').mkdir(parents=True, exist_ok=True)
              (EXP / 'informes' / 'informe.md').write_text(informe, encoding='utf-8')
              make_map(poly, informe)

              if os.environ.get('GITHUB_STEP_SUMMARY'):
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
                      fh.write(informe)
              for r in resultados:
                  if r['estado'] == 'ERROR':
                      print(f"::warning title=Agente {r['agente']}::{r['resumen'][:200]}")
              print(informe)


          if __name__ == '__main__':
              main()
          PY

      - name: Ejecutar sistema maestro
        run: python agentes/sistema_finca.py

      - name: Guardar expediente
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expediente-finca-lurra
          path: expediente/
          if-no-files-found: warn

      - name: Guardar sistema y geometria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sistema-finca-lurra
          path: |
            agentes/
            datos/finca.kml

      - name: Preparar mapa para GitHub Pages
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publicar_pagina }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  despliegue:
    needs: analisis
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publicar_pagina }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
