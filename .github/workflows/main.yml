name: Sistema Maestro de la Finca

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sistema-maestro:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Crear expediente digital
        run: |
          mkdir -p expediente/terreno
          mkdir -p expediente/agua
          mkdir -p expediente/clima
          mkdir -p expediente/suelo
          mkdir -p expediente/vegetacion
          mkdir -p expediente/satelite
          mkdir -p expediente/parcelas
          mkdir -p expediente/normativa
          mkdir -p expediente/analisis
          mkdir -p expediente/informes

          cat > expediente/finca.json <<'EOF'
          {
            "nombre": "Finca",
            "coordenadas": {
              "latitud": null,
              "longitud": null
            },
            "estado": "preparada",
            "agentes": {
              "terreno": "pendiente",
              "agua": "pendiente",
              "clima": "pendiente",
              "suelo": "pendiente",
              "vegetacion": "pendiente",
              "satelite": "pendiente",
              "parcelas": "pendiente",
              "normativa": "pendiente",
              "analista": "pendiente"
            }
          }
          EOF

      - name: Ejecutar Agente Maestro
        run: |
          echo "======================================"
          echo "       AGENTE MAESTRO DE LA FINCA"
          echo "======================================"
          echo ""
          echo "Expediente digital creado."
          echo ""
          echo "Agentes preparados:"
          echo "- Terreno"
          echo "- Agua"
          echo "- Clima"
          echo "- Suelo"
          echo "- Vegetación"
          echo "- Satélite"
          echo "- Parcelas"
          echo "- Normativa"
          echo "- Analista"
          echo ""
          echo "Siguiente agente: TERRENO"

      - name: Guardar expediente
        uses: actions/upload-artifact@v4
        with:
          name: expediente-finca
          path: expediente/
