name: Ejecutar proyecto

on:
  workflow_dispatch:

jobs:
  ejecutar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Obtener datos IDENA
        run: |
          curl -L "https://idena.navarra.es/ogc/wfs" \
            --data-urlencode "service=WFS" \
            --data-urlencode "request=GetCapabilities" \
            -o idena-capabilities.xml

      - name: Obtener datos de Bera
        run: |
          curl -L --get "https://idena.navarra.es/ogc/wfs" \
            --data-urlencode "service=WFS" \
            --data-urlencode "version=2.0.0" \
            --data-urlencode "request=GetFeature" \
            --data-urlencode "typeNames=IDENA:OCUPAC_Pol_MCA_VE2000" \
            --data-urlencode "outputFormat=application/json" \
            --data-urlencode "count=20" \
            --data-urlencode "CQL_FILTER=MUNICIPIO='Bera' AND GRUPO='Frondosas'" \
            -o bera-frondosas.json

      - name: Guardar datos IDENA
        uses: actions/upload-artifact@v4
        with:
          name: idena-capabilities
          path: idena-capabilities.xml

      - name: Guardar datos de Bera
        uses: actions/upload-artifact@v4
        with:
          name: bera-frondosas
          path: bera-frondosas.json

      - name: Mostrar estructura
        run: |
          echo "Repositorio lurrak-lurrak-permacultura"
          echo "Flujo de trabajo ejecutado correctamente"
          find . -maxdepth 2 -type f | sort
